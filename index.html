<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星灯ルナ — 成長編</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <div class="stars"></div>
    <div class="scan"></div>

    <div class="chrome live">
      <span class="dot"></span>
      <span class="label">LIVE</span>
      <span class="viewers" id="viewers">1,842 watching</span>
    </div>
    <div class="chrome nameplate">
      <div class="jp">星灯ルナ</div>
      <div class="sub">HOSHITO RUNA  ·  星の灯を配る人</div>
    </div>
    <div class="chrome topic-chip" id="topic">序章</div>
    <div class="stat-panel" id="stats">
      <div class="stat" data-stat="bond"><span>絆</span><i><b></b></i></div>
      <div class="stat" data-stat="talent"><span>才能</span><i><b></b></i></div>
      <div class="stat" data-stat="guts"><span>勇気</span><i><b></b></i></div>
    </div>

    <div id="vtuber">
      <div class="avatar-wrap" id="character">
        <img class="talent" src="img/talent.png" alt="配信キャラ" />
        <div class="mouth-layer" aria-hidden="true">
          <span class="mouth mouth-closed"></span>
          <span class="mouth mouth-small"></span>
          <span class="mouth mouth-open"></span>
          <span class="mouth mouth-wide"></span>
        </div>
      </div>
    </div>

    <div class="caption" id="caption">星の灯、つけるね。</div>

    <div class="choices">
      <button class="choice" id="choice-a" type="button">
        <span class="key">ルート A</span>
        <span class="txt">…</span>
      </button>
      <button class="choice" id="choice-b" type="button">
        <span class="key">ルート B</span>
        <span class="txt">…</span>
      </button>
    </div>

    <div class="gate hidden" id="gate">
      <button type="button" id="start-btn">物語をはじめる</button>
    </div>
  </div>

  <script src="js/generator.js"></script>
  <script src="js/lmstudio.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
